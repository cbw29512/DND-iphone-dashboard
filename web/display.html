<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Iron Lantern — Player Screen</title><link rel="stylesheet" href="/static/base.css"><link rel="stylesheet" href="/static/display.css">
<script type="module" src="/static/display.js"></script></head>
<body class="player-body"><main id="player-root" class="player-root" aria-live="polite"></main>
<section id="pair-screen" class="pair-screen" hidden><form id="pair-form" class="pair-card">
<div class="brand-mark">✧</div><p class="eyebrow">IRON LANTERN</p><h1>Join the table</h1>
<p>Enter the six-digit code shown on your DM's laptop.</p><label for="code">Pairing code</label>
<input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required>
<button class="primary full" type="submit">Connect display →</button><p id="pair-error" class="error" role="alert"></p>
</form></section>
<div id="display-status" class="display-status" role="status" aria-live="polite">Connecting…</div>
</body></html>
