name: Iron Lantern Cloud Beta Checks
on:
  push:
    branches:
      - feat/secure-iphone-sync
      - feat/cloud-beta-foundation
  pull_request:
    paths:
      - 'cloud-beta/**'
      - '.github/workflows/cloud-beta.yml'
jobs:
  cards-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        working-directory: cloud-beta
        run: |
          for file in *.js; do node --check "$file"; done
      - name: RAW card and public privacy tests
        working-directory: cloud-beta
        run: npm test
