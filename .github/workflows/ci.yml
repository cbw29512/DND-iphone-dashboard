name: Application Quality Gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: |
          for script in web/*.js; do node --check "$script"; done
      - run: node tests/character-spells.test.js
      - run: node tests/character-compact.test.js
      - run: node tests/character-form.test.js
      - run: node tests/character-editor-layout.test.js
      - run: node tests/character-live-preview.test.js
      - run: node tests/character-sketch-layout.test.js
      - run: node tests/character-quick-build.test.js
      - run: node tests/character-table-display.test.js
      - run: node tests/character-workshop.test.js
      - run: node tests/character-workshop-catalog.test.js
